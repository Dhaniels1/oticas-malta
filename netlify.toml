# React CRA com rotas na raiz do domínio Netlify.
# Mantém o build GitHub Pages independente, utilizando PUBLIC_URL em cada ambiente.
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  PUBLIC_URL = "/"
  NPM_FLAGS = "--no-package-lock --no-audit --no-fund"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
