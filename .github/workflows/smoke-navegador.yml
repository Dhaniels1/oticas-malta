name: Verificar renderizacao no navegador

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configurar navegador Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Verificar pagina no Netlify e GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chrome)"
          test -x "$CHROME"
          echo "Chrome: $CHROME"
          for url in \
            "https://oticas-malta-demo.netlify.app/" \
            "https://dhaniels1.github.io/oticas-malta/"; do
            echo "::group::Testando $url"
            rm -f /tmp/malta-dom.html /tmp/malta-console.log
            timeout 70s "$CHROME" --headless=new --no-sandbox \
              --disable-dev-shm-usage --disable-gpu \
              --disable-features=Translate \
              --window-size=1366,900 --virtual-time-budget=15000 \
              --dump-dom "$url" \
              > /tmp/malta-dom.html 2> /tmp/malta-console.log || {
                cat /tmp/malta-console.log | tail -70
                exit 1
              }
            if ! grep -q 'Um novo jeito' /tmp/malta-dom.html; then
              echo "::error::A tela não renderizou o título no navegador: $url"
              head -c 2200 /tmp/malta-dom.html || true
              echo
              tail -100 /tmp/malta-console.log || true
              exit 1
            fi
            echo "Renderização confirmada: $url"
            echo "::endgroup::"
          done
