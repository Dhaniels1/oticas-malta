name: Verificar renderizacao no navegador

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar navegador Chrome
        uses: browser-actions/setup-chrome@v2
      - name: Preparar Playwright
        run: |
          mkdir -p /tmp/browser-smoke
          npm install --prefix /tmp/browser-smoke --no-save --no-package-lock --no-audit --no-fund playwright-core@1.58.2
      - name: Capturar erros reais de renderização
        env:
          NODE_PATH: /tmp/browser-smoke/node_modules
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/smoke-browser.cjs
