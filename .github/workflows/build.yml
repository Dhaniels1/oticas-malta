name: Build e publicacao da Oticas Malta

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: oticas-malta-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # O lockfile legado ainda precisa ser regenerado para refletir package.json.
      # Instala sem consultar/gravar o lockfile até essa correção ser concluída.
      - name: Instalar dependências (lockfile legado incompatível)
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Auditar catálogo totalmente fictício
        run: node --test tests/catalogo-ficticio.test.cjs

      - name: Verificar build estático
        run: npm run build

      - name: Publicar o build na branch gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages

