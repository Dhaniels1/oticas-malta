name: Build do site

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # O lockfile legado ainda precisa ser regenerado para refletir package.json.
      # Instala sem consultar/gravar o lockfile até essa correção ser concluída.
      - name: Instalar dependências (lockfile legado incompatível)
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Verificar build estático
        run: npm run build
